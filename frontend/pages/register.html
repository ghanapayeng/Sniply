<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — Sniply</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .password-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon">✂</div>
        <span>Snip<span style="color: var(--primary);">ly</span></span>
      </a>
      <div class="nav-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn">🌙</button>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-subtitle">Get custom aliases, unlimited links, and deep click analytics.</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" required placeholder="alexsmith" autocomplete="username">
          <div class="password-hint">Letters, numbers, and underscores (3-30 chars).</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" class="form-control" required placeholder="alex@example.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••" autocomplete="new-password">
          <div class="password-hint">Minimum 8 characters with at least one letter and number.</div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          <span>Get Started</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/pages/login.html" style="font-weight: 600;">Sign in</a>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();

      const form = document.getElementById("register-form");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        submitBtn.disabled = true;
        submitBtn.innerHTML = "<span>Creating account...</span>";

        try {
          const user = await AuthService.register(username, email, password);
          showToast(`Account created! Welcome to Sniply, ${user.username}.`, "success");
          setTimeout(() => {
            window.location.href = "/pages/dashboard.html";
          }, 400);
        } catch (err) {
          showToast(err.message || "Failed to create account. Please check inputs.", "error");
          submitBtn.disabled = false;
          submitBtn.innerHTML = "<span>Get Started</span>";
        }
      });
    });

    function initTheme() {
      const savedTheme = localStorage.getItem("sniply_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      const btn = document.getElementById("theme-toggle-btn");
      if (btn) {
        btn.innerHTML = savedTheme === "dark" ? "☀️" : "🌙";
        btn.addEventListener("click", () => {
          const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("sniply_theme", next);
          btn.innerHTML = next === "dark" ? "☀️" : "🌙";
        });
      }
    }
  </script>
</body>
</html>
