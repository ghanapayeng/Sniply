<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Sniply</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon">✂</div>
        <span>Snip<span style="color: var(--primary);">ly</span></span>
      </a>
      <div class="nav-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn">🌙</button>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your Sniply account to manage your links.</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="identifier">Email or Username</label>
          <input type="text" id="identifier" class="form-control" required placeholder="you@example.com" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">
          <span>Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/pages/register.html" style="font-weight: 600;">Sign up</a>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();

      const form = document.getElementById("login-form");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const identifier = document.getElementById("identifier").value.trim();
        const password = document.getElementById("password").value;
        const remember = document.getElementById("remember-me").checked;

        submitBtn.disabled = true;
        submitBtn.innerHTML = "<span>Signing in...</span>";

        try {
          const user = await AuthService.login(identifier, password, remember);
          showToast(`Welcome back, ${user.username}!`, "success");
          
          const params = new URLSearchParams(window.location.search);
          const returnUrl = params.get("returnUrl") || "/pages/dashboard.html";
          setTimeout(() => {
            window.location.href = returnUrl;
          }, 400);
        } catch (err) {
          showToast(err.message || "Failed to sign in. Please verify credentials.", "error");
          submitBtn.disabled = false;
          submitBtn.innerHTML = "<span>Sign In</span>";
        }
      });
    });

    function initTheme() {
      const savedTheme = localStorage.getItem("sniply_theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      const btn = document.getElementById("theme-toggle-btn");
      if (btn) {
        btn.innerHTML = savedTheme === "dark" ? "☀️" : "🌙";
        btn.addEventListener("click", () => {
          const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", next);
          localStorage.setItem("sniply_theme", next);
          btn.innerHTML = next === "dark" ? "☀️" : "🌙";
        });
      }
    }
  </script>
</body>
</html>
