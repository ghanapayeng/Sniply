<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — Sniply</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .status-page-wrapper {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .status-card {
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      box-shadow: var(--shadow-lg);
    }
    .status-code-badge {
      font-size: 4rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 1rem;
    }
    .status-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
    }
    .status-description {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-brand">
        <div class="brand-icon">✂</div>
        <span>Snip<span style="color: var(--primary);">ly</span></span>
      </a>
      <div class="nav-actions">
        <button id="theme-toggle-btn" class="theme-toggle-btn">🌙</button>
      </div>
    </div>
  </header>

  <main class="status-page-wrapper">
    <div class="status-card">
      <div class="status-code-badge">404</div>
      <h1 class="status-title">Link Not Found</h1>
      <p class="status-description">
        The short link you are looking for does not exist, has been removed, or the URL code was typed incorrectly.
      </p>
      <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <a href="/index.html" class="btn btn-primary">Return Home</a>
        <a href="/pages/dashboard.html" class="btn btn-outline">Go to Dashboard</a>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
