<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Password required</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 400px; margin: 100px auto; text-align: center; }
  input, button { font-size: 1rem; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-top: 10px; width: 100%; box-sizing: border-box; }
  button { background: #2563eb; color: white; border: none; cursor: pointer; }
</style>
</head>
<body>
  <h2>🔒 This link is password protected</h2>
  <input type="password" id="pw" placeholder="Enter password">
  <button onclick="go()">Continue</button>
  <script>
    function go() {
      const pw = document.getElementById('pw').value;
      window.location.href = `/{{ code }}?password=${encodeURIComponent(pw)}`;
    }
  </script>
</body>
</html>
