# Render Infrastructure as Code Blueprint for Sniply
# Frontend (Static Site) + Backend (Flask Web Service on Render) + Neon PostgreSQL
services:
  # 1. Frontend: Render Static Site
  - type: web
    name: sniply-web
    env: static
    buildCommand: ""
    staticPublishPath: ./frontend
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend: Flask REST API & Redirection Engine
  - type: web
    name: sniply-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && flask --app run:app db upgrade -d migrations"
    startCommand: "gunicorn --config gunicorn.conf.py wsgi:app"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL pooled connection string
      - key: DATABASE_URL_UNPOOLED
        sync: false # Set to your Neon PostgreSQL unpooled connection string (used for migrations)
      - key: REDIS_URL
        sync: false # Optional: Set to your Redis / Upstash Redis connection string
      - key: BASE_URL
        value: https://sniply-api.onrender.com
      - key: FRONTEND_URL
        value: https://sniply-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://sniply-web.onrender.com,https://sniply-api.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: ANONYMOUS_MAX_EXPIRY_DAYS
        value: "30"
      - key: DEFAULT_EXPIRY_DAYS
        value: "90"
      - key: IP_HASH_SALT
        generateValue: true
      - key: ADMIN_BOOTSTRAP_USERNAME
        value: admin
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@sniply.io
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false # Configure in Render Environment Variables

