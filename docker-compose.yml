version: "3.8"

services:
  # Python Flask Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sniply-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-sniply-docker-super-secret-production-key-change-me}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sniply}:${POSTGRES_PASSWORD:-sniplypassword}@postgres:5432/${POSTGRES_DB:-sniply}
      - REDIS_URL=redis://redis:6379/0
      - RATELIMIT_STORAGE_URI=redis://redis:6379/0
      - BASE_URL=${BASE_URL:-http://localhost:5000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5000}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000,http://127.0.0.1:3000,http://127.0.0.1:5000}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-admin}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-admin@sniply.io}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-SuperSecretAdminPass123!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Local PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sniply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sniply}
      POSTGRES_USER: ${POSTGRES_USER:-sniply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sniplypassword}
    ports:
      - "5432:5432"
    volumes:
      - sniply_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sniply} -d ${POSTGRES_DB:-sniply}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local Redis Cache & Limiter
  redis:
    image: redis:7-alpine
    container_name: sniply-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sniply_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sniply_postgres_data:
  sniply_redis_data:
